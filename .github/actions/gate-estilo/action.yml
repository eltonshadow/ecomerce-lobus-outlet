name: Gate de estilo
description: >-
  Mede o codigo da branch base e o do PR com as mesmas regras, comenta a
  comparacao e reprova se alguma metrica piorou.

inputs:
  token:
    description: Token com permissao de escrita em pull requests
    required: true
  limite-arquivo:
    description: Linhas acima das quais um arquivo conta como grande
    required: false
    default: '500'
  limite-funcao:
    description: Linhas de codigo (NLOC) acima das quais uma funcao conta como longa
    required: false
    default: '60'
  limite-ccn:
    description: Complexidade ciclomatica acima da qual uma funcao e contada
    required: false
    default: '10'
  cli-dirs:
    description: Diretorios onde console.log e a interface, nao debug solto
    required: false
    default: 'scripts bin cli prisma'

runs:
  using: composite
  steps:
    # jscpd 4.3.0 resolve commander@15 (ESM, engines.node >= 22.12). No goku o
    # Node do runner e 18: npm instala mesmo assim (EBADENGINE) e o binario
    # quebra com ERR_REQUIRE_ESM. A metrica sai `na` e, por ser informativa, o
    # gate aprova sem ter medido. Esta versao e a do jscpd, nao a do projeto —
    # repo Go/Python tambem precisa dela.
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '22'

    - name: Instalar as ferramentas de medicao
      shell: bash
      # lizard mede NLOC e complexidade por funcao em qualquer linguagem, sem
      # ler config do projeto — requisito para medir a base, que ainda nao tem
      # estas regras configuradas.
      #
      # jscpd nao e chamado por `npx` porque o npx resolve dependencias contra
      # o package.json do repositorio medido e aborta em repo com conflito de
      # `overrides`. Prefixo em RUNNER_TEMP, e nao `npm -g` no prefixo do
      # usuario: no self-hosted o prefixo aponta pra ~/.local, onde ja mora um
      # jscpd quebrado instalado sob Node 18, e o PATH continua achando ele.
      run: |
        # Versao exata, nao faixa. A base e o PR sao medidos no mesmo job, entao
        # a consistencia dentro da execucao ja estava garantida; o pin existe
        # para (a) nao instalar uma versao publicada depois, sem revisao, no
        # caminho que decide se um PR entra, e (b) reproduzir um numero antigo.
        # Renovate abre PR quando sair versao nova.
        pipx install lizard==1.24.0 || pip install --break-system-packages lizard==1.24.0
        PREFIX="$RUNNER_TEMP/gate-tools"
        npm install -g --prefix "$PREFIX" jscpd@4.3.0
        echo "$PREFIX/bin" >> "$GITHUB_PATH"
        "$PREFIX/bin/jscpd" --version

    - name: Medir a base e o codigo novo
      id: medir
      shell: bash
      env:
        # Em PR a base e o alvo do merge. Em push e o tip anterior da branch,
        # entao o "acrescentado" e exatamente o que aquele push trouxe — a mesma
        # semantica, sem catraca commitada. Sem isso o gate so rodava em PR e o
        # deploy, que roda em push, aceitava o job pulado e ia sem verificacao.
        BASE_SHA: ${{ github.event_name == 'push'
          && github.event.before
          || github.event.pull_request.base.sha }}
        LIMITE_ARQUIVO: ${{ inputs.limite-arquivo }}
        LIMITE_FUNCAO: ${{ inputs.limite-funcao }}
        LIMITE_CCN: ${{ inputs.limite-ccn }}
        CLI_DIRS: ${{ inputs.cli-dirs }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Branch nova ou primeiro push: nao existe base, e comparar com o vazio
        # acusaria o repositorio inteiro como acrescimo deste push.
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          echo "::notice::sem commit anterior nesta ref — nada a comparar"
          echo "pulou=1" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Commit ausente com base declarada e force-push que descartou historico
        # ou checkout raso. Reprovar aqui e proposital: passar transformaria
        # force-push num jeito de burlar o gate.
        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          echo "::error::commit base $BASE_SHA ausente — o checkout precisa de fetch-depth: 0"
          exit 1
        fi

        # O .gate-estilo-ignore do PR vale para os dois lados. Se cada lado
        # usasse o seu, um PR que adiciona exclusoes mediria a base sem elas e
        # passaria de graca.
        export IGNORE_FILE="$GITHUB_WORKSPACE/.gate-estilo-ignore"

        # Num runner self-hosted nem /tmp nem $RUNNER_TEMP sao esvaziados entre
        # jobs (medido no goku): o worktree do job anterior continua no disco e
        # registrado no .git do workspace. Apagar e podar antes deixa o add sem
        # depender de limpeza de fora.
        BASE_DIR="$RUNNER_TEMP/gate-base"
        rm -rf "$BASE_DIR"
        git worktree prune
        git worktree add --detach "$BASE_DIR" "$BASE_SHA" > /dev/null
        (cd "$BASE_DIR" && bash "$ACTION_PATH/contar.sh") > /tmp/gate-antes.tsv
        bash "$ACTION_PATH/contar.sh" > /tmp/gate-depois.tsv

        echo "--- base:";  cat /tmp/gate-antes.tsv
        echo "--- agora:";  cat /tmp/gate-depois.tsv

    - name: Comparar e comentar no PR
      if: steps.medir.outputs.pulou != '1'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        # Vazio em push: o comparador so comenta quando ha PR, e no push o
        # resultado fica no resumo do run.
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_REF: ${{ github.event_name == 'push'
          && github.ref_name
          || github.event.pull_request.base.ref }}
        BASE_SHA: ${{ github.event_name == 'push'
          && github.event.before
          || github.event.pull_request.base.sha }}
        LIMITE_ARQUIVO: ${{ inputs.limite-arquivo }}
        LIMITE_FUNCAO: ${{ inputs.limite-funcao }}
        LIMITE_CCN: ${{ inputs.limite-ccn }}
      run: python3 "${{ github.action_path }}/comparar.py" /tmp/gate-antes.tsv /tmp/gate-depois.tsv
